<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JDB1N7YPE9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JDB1N7YPE9');

  // Enquiry conversions. Every form redirects to a thank-you page, so the
  // arrival on that page is the conversion. ?src= tells us which form it was.
  (function () {
    if (location.pathname.indexOf('thank-you') === -1) return;
    var src = new URLSearchParams(location.search).get('src') || 'contact';
    gtag('event', 'generate_lead', {
      form_source: src,
      page_path: location.pathname
    });
  })();
</script>
