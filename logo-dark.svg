<svg xmlns="http://www.w3.org/2000/svg" width="305" height="72" viewBox="0 0 305 72" role="img" aria-label="Animus Tech, AI finds the candidates. We find the fit.">
  <defs>
    <linearGradient id="ringLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D9BD"/><stop offset=".45" stop-color="#DFB78E"/><stop offset="1" stop-color="#C1955F"/>
    </linearGradient>
    <linearGradient id="ringRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6C0F0"/><stop offset=".45" stop-color="#9D94E0"/><stop offset="1" stop-color="#7A70C4"/>
    </linearGradient>
    <linearGradient id="wordGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F2F4F9"/><stop offset="1" stop-color="#CFD4E0"/>
    </linearGradient>
  </defs>
  <g transform="translate(1 1)">
    <circle cx="20" cy="20" r="17" fill="none" stroke="url(#ringLeft)" stroke-width="3"/>
    <circle cx="36" cy="20" r="17" fill="none" stroke="url(#ringRight)" stroke-width="3"/>
  </g>
  <text x="75" y="33.07" font-family="Inter, Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" letter-spacing="-0.85" fill="url(#wordGloss)"><tspan font-weight="700">Animus</tspan><tspan font-weight="400" fill="#B6BCCC"> Tech</tspan></text>
  <text x="75" y="57" font-family="Inter, Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8B92A4">AI finds the candidates. We find the fit.</text>
</svg>
